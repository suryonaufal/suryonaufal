# ============================================================
# Snake Contribution Animation — GitHub Actions Workflow
# File: .github/workflows/snake.yml
# ============================================================
# Cara kerja:
#   - Otomatis jalan setiap hari jam 00:00 UTC
#   - Generate dua versi SVG: light & dark
#   - Simpan ke branch "output" di repo ini
#   - README langsung baca dari branch output tersebut
# ============================================================

name: Generate Snake Animation

on:
  schedule:
    # Jalan setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"

  # Bisa juga dijalankan manual dari tab Actions
  workflow_dispatch:

  # Jalan juga setiap push ke main (untuk test pertama kali)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake (Dark Mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: suryonaufal
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github

      - name: Push Snake SVGs to "output" branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
